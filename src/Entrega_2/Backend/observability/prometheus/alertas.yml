# Regras de alerta (avaliadas pelo Prometheus; visíveis em http://127.0.0.1:9090/alerts).
# Os limiares seguem os objetivos do relatório: p95 < 1 s, erros 5xx < 2 %, memória < 80 % do limite.
groups:
  - name: asa-conecta-api
    rules:
      - alert: ApiIndisponivel
        expr: up{job="api"} == 0
        for: 1m
        labels: { severidade: critica }
        annotations:
          resumo: "A API não responde à coleta de métricas há 1 minuto."
          acao: "docker compose ps / logs api; conferir /health (banco e agente)."

      - alert: LatenciaP95Alta
        expr: histogram_quantile(0.95, sum by (le) (rate(asa_http_request_duration_seconds_bucket{route!="unmatched"}[2m]))) > 1
        for: 2m
        labels: { severidade: alta }
        annotations:
          resumo: "p95 da latência da API acima de 1 s por 2 minutos."
          acao: "Ver no painel a rota mais lenta, CPU da API (throttling) e conexões em espera no pool."

      - alert: TaxaDeErros5xx
        expr: (sum(rate(asa_http_requests_total{status_code=~"5.."}[2m])) / clamp_min(sum(rate(asa_http_requests_total[2m])), 1e-9)) > 0.02
        for: 2m
        labels: { severidade: alta }
        annotations:
          resumo: "Mais de 2 % das respostas da API são erros 5xx."
          acao: "Filtrar os logs por level=error e request_id; conferir banco e agente."

      - alert: EventLoopBloqueado
        expr: nodejs_eventloop_lag_seconds{quantile="0.99"} > 0.2
        for: 2m
        labels: { severidade: media }
        annotations:
          resumo: "Event loop do Node.js com atraso p99 acima de 200 ms (CPU saturada ou trabalho síncrono)."

      - alert: PoolDoBancoComEspera
        expr: asa_db_pool_connections{state="waiting"} > 0
        for: 2m
        labels: { severidade: media }
        annotations:
          resumo: "Requisições esperando conexão no pool do PostgreSQL por 2 minutos."
          acao: "Avaliar DATABASE_POOL_MAX e consultas lentas (pg_stat_statements)."

  - name: asa-conecta-infra
    rules:
      - alert: MemoriaDoConteinerAlta
        expr: (container_memory_working_set_bytes{container_label_com_docker_compose_service!=""} / (container_spec_memory_limit_bytes{container_label_com_docker_compose_service!=""} > 0)) > 0.8
        for: 5m
        labels: { severidade: media }
        annotations:
          resumo: "Contêiner {{ $labels.container_label_com_docker_compose_service }} acima de 80 % do limite de memória."

      - alert: CpuDoConteinerLimitada
        expr: (rate(container_cpu_cfs_throttled_periods_total{container_label_com_docker_compose_service!=""}[2m]) / clamp_min(rate(container_cpu_cfs_periods_total[2m]), 1e-9)) > 0.25
        for: 5m
        labels: { severidade: media }
        annotations:
          resumo: "Contêiner {{ $labels.container_label_com_docker_compose_service }} limitado por CPU (throttling) em mais de 25 % dos períodos."

      - alert: BancoComMuitasConexoes
        expr: sum(pg_stat_activity_count) > 80
        for: 2m
        labels: { severidade: media }
        annotations:
          resumo: "Mais de 80 conexões abertas no PostgreSQL (max_connections = 100)."
