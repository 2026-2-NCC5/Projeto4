name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contratos sincronizados
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Entrega_2/Backend
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-contracts-sync.sh

  agent-service:
    name: Agent Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Entrega_2/Backend/agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/Entrega_2/Backend/agent-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      # uv.lock fixa as versões instaladas no build da Vercel: precisa refletir o pyproject.toml
      - name: uv.lock em dia com o pyproject.toml
        run: pip install uv && uv lock --check

  api:
    name: API (Node.js) — lint, typecheck, unit, integração, E2E
    runs-on: ubuntu-latest
    needs: [agent-service]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asa
          POSTGRES_PASSWORD: asa_ci_password
          POSTGRES_DB: asa_conecta_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asa -d asa_conecta_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://asa:asa_ci_password@localhost:5432/asa_conecta_ci
      TEST_DATABASE_URL: postgres://asa:asa_ci_password@localhost:5432/asa_conecta_ci
      MAIL_TRANSPORT: disabled
      JWT_SECRET: ci-secret-not-for-production-0123456789abcdef
      AGENT_SERVICE_PYTHON: python3
    defaults:
      run:
        working-directory: src/Entrega_2/Backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Entrega_2/Backend/api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências do Agent Service (para o E2E real)
        run: pip install -r ../agent-service/requirements.txt
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run build
      # A MESMA entrada da Vercel (src/index.ts: sem laços, fila sob demanda) + Agent Service real, sem Docker
      - name: Smoke test — entrada serverless (src/index.ts) com PostgreSQL e Agent Service reais
        env:
          PORT: "3100"
          AGENT_SERVICE_URL: http://127.0.0.1:8000
          AGENT_SERVICE_TOKEN: ci-agent-token-0123456789abcdef
          CRON_SECRET: ci-cron-secret-0123456789abcdef
          ASA_QUEUE_PROVIDER: mock
          PUSH_PROVIDER: log
          SMOKE_EMAIL: estudante.exemplo@demo.asa
          SMOKE_PASSWORD: Demo@2026
        run: |
          (cd ../agent-service && nohup python -m uvicorn app.main:app --port 8000 > agent.log 2>&1 &)
          nohup npm run start:vercel-entry > vercel-entry.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3100/health > /dev/null && break; sleep 1; done
          npm run smoke -- http://localhost:3100
          curl -sf -H "Authorization: Bearer $CRON_SECRET" http://localhost:3100/api/internal/jobs/sla-scan
      - name: Logs do smoke test (falha)
        if: failure()
        run: tail -n 100 vercel-entry.log ../agent-service/agent.log || true

  mobile:
    name: Mobile (Expo) — lint, typecheck, testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Entrega_2/Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/Entrega_2/Frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  web:
    name: Portal web (React) — lint, typecheck, testes, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Entrega_2/Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Entrega_2/Web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  web-e2e:
    name: Portal web — E2E (Playwright) com API e PostgreSQL reais
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asa
          POSTGRES_PASSWORD: asa_ci_password
          POSTGRES_DB: asa_conecta_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asa -d asa_conecta_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://asa:asa_ci_password@localhost:5432/asa_conecta_ci
      JWT_SECRET: ci-secret-not-for-production-0123456789abcdef
      MAIL_TRANSPORT: disabled
      PUSH_PROVIDER: disabled
      ASA_QUEUE_PROVIDER: mock
      # muitos logins seguidos no mesmo IP do runner (só no CI)
      RATE_LIMIT_ENABLED: "false"
      WEB_ORIGINS: http://localhost:4173,http://127.0.0.1:4173,http://localhost:4174,http://127.0.0.1:4174
      AGENT_SERVICE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/Entrega_2/Backend/api/package-lock.json
            src/Entrega_2/Web/package-lock.json
      - name: API — build, migrations e seeds fictícios
        working-directory: src/Entrega_2/Backend/api
        run: |
          npm ci
          npm run build
          npm run db:migrate
          npm run db:seed
      - name: API — sobe duas instâncias (demonstração ligada :3000 e desligada :3001)
        working-directory: src/Entrega_2/Backend/api
        run: |
          nohup node dist/server.js > api.log 2>&1 &
          PORT=3001 DEMO_DATA_ENABLED=false nohup node dist/server.js > api-demo-off.log 2>&1 &
          for port in 3000 3001; do
            for i in $(seq 1 60); do curl -sf "http://localhost:$port/health" > /dev/null && break; sleep 1; done
            curl -sf "http://localhost:$port/health" > /dev/null
          done
      - name: Portal web — dependências e navegador
        working-directory: src/Entrega_2/Web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: E2E
        working-directory: src/Entrega_2/Web
        env:
          E2E_START_PREVIEW: "1"
        run: npm run test:e2e
      - name: Relatório e logs (falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-report
          path: |
            src/Entrega_2/Web/playwright-report
            src/Entrega_2/Web/test-results
            src/Entrega_2/Backend/api/api.log
            src/Entrega_2/Backend/api/api-demo-off.log
          retention-days: 7

  vercel-build:
    name: Vercel — build dos projetos backend (api + agent) e frontend (portal) sem implantar
    runs-on: ubuntu-latest
    needs: [api, agent-service, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      # vínculo local fictício: `vercel build` lê o vercel.json de cada pasta e não consulta a conta
      - name: vercel build — backend (src/Entrega_2/Backend) e frontend (src/Entrega_2/Web)
        run: |
          for dir in src/Entrega_2/Backend src/Entrega_2/Web; do
            mkdir -p "$dir/.vercel"
            echo '{"projectId":"prj_ci_build","orgId":"team_ci_build","settings":{}}' > "$dir/.vercel/project.json"
            : > "$dir/.vercel/.env.preview.local"
            ( cd "$dir" && npx -y vercel@65.4.0 build --yes -Q "$RUNNER_TEMP/vercel-cli" )
          done
      - name: Saída esperada (funções, rotas, cron, portal, pacote executável)
        run: |
          test -f src/Entrega_2/Web/.vercel/output/static/index.html
          node -e "
            const out = 'src/Entrega_2/Backend/.vercel/output';
            const c = require('./' + out + '/config.json');
            if (!c.routes.some((r) => r.destination && r.destination.service === 'api')) throw new Error('rota para o serviço api ausente');
            if (!c.crons || c.crons.length === 0) throw new Error('cron ausente');
            const api = require('./' + out + '/services/api/functions/index.func/.vc-config.json');
            const files = Object.keys(api.filePathMap || {});
            // o handler precisa enxergar o node_modules (mesma árvore); handler na raiz + api/node_modules quebra os imports
            const base = api.handler.includes('/') ? api.handler.split('/')[0] + '/' : '';
            if (!files.some((f) => f.startsWith(base + 'node_modules/express/'))) throw new Error('handler ' + api.handler + ' não resolve node_modules');
            if (api.maxDuration !== 300) throw new Error('maxDuration da api: ' + api.maxDuration);
            const agent = require('./' + out + '/services/agent/functions/fastapi.func/.vc-config.json');
            const agentFiles = Object.keys(agent.filePathMap || {});
            if (!agentFiles.some((f) => f.endsWith('app/config/rules.yaml'))) throw new Error('YAML do agente fora do pacote');
            if (agentFiles.some((f) => f.includes('/tests/'))) throw new Error('testes dentro do pacote do agente');
            const web = require('./src/Entrega_2/Web/.vercel/output/config.json');
            if (!JSON.stringify(web.routes).includes('/api/')) throw new Error('portal sem rewrite de /api para o backend');
          "

  docker:
    name: Docker — build das imagens (opcional; produção não usa Docker)
    runs-on: ubuntu-latest
    needs: [api, agent-service, web]
    defaults:
      run:
        working-directory: src/Entrega_2/Backend
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api agent-service web
